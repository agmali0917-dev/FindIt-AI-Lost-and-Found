version: '3.9'

services:
  # ─── MongoDB ───────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: findit-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: findit
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docs/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - findit-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/findit --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── AI Service ────────────────────────────────────────────────────────────
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: findit-ai
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    volumes:
      - ai_models:/root/.cache/clip
    networks:
      - findit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ─── Backend API ───────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: findit-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/findit?authSource=admin
      - AI_SERVICE_URL=http://ai-service:8000
    ports:
      - "5000:5000"
    volumes:
      - server_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks:
      - findit-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend ──────────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SOCKET_URL: ""
    container_name: findit-client
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - findit-network

  # ─── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: findit-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docs/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client
      - server
    networks:
      - findit-network

volumes:
  mongodb_data:
  ai_models:
  server_uploads:

networks:
  findit-network:
    driver: bridge
